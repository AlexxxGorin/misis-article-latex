name: Build article PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XeLaTeX and Russian language support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-cyrillic texlive-latex-extra \
            texlive-fonts-recommended fonts-texgyre fonts-liberation

      - name: Render LaTeX from the article source
        run: python3 scripts/render_article.py

      - name: Build PDF
        run: |
          mkdir -p build
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build article.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build article.tex

      - name: Upload article PDF
        uses: actions/upload-artifact@v4
        with:
          name: article-pdf
          path: build/article.pdf
          if-no-files-found: error
